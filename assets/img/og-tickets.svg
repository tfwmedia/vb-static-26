    <text x="90" y="80" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#1a1a1a">kleines</text>
    <text x="90" y="120" text-anchor="middle" font-family="Georgia, serif" font-size="44" font-weight="700" fill="#1a1a1a">theater</text>
    <text x="90" y="160" text-anchor="middle" font-family="Georgia, serif" font-size="22" font-weight="400" fill="#c31e2e">der volksbühne</text>
  </g>

  <g transform="translate(80, 340)">
