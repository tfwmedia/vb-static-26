<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="title desc">
  <title id="title">Anfahrtsskizze — Das Wormser, Worms</title>
  <desc id="desc">Stilisierte Stadtkarte von Worms mit markierter Position des Wormser (Rathenaustraße) und einem Standort-Pin.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eef1ed"/>
      <stop offset="100%" stop-color="#dde2dc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 L0 0 0 40" fill="none" stroke="#d0d4cc" stroke-width="0.6"/>
    </pattern>
    <radialGradient id="pinShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1a1a1a" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#1a1a1a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bg)"/>
  <rect width="800" height="450" fill="url(#grid)"/>

  <!-- River Rhine -->
  <path d="M0 250 C 200 240, 400 260, 600 220 S 800 200, 800 200 L 800 280 C 600 270, 400 290, 200 280 S 0 280, 0 280 Z"
        fill="#a9c7db" opacity="0.7"/>
  <text x="60" y="270" fill="#5a6f7d" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" opacity="0.7">Rhein</text>

  <!-- Park / green -->
  <rect x="500" y="80" width="200" height="140" rx="8" fill="#c9d8bd" opacity="0.7"/>
  <text x="540" y="160" fill="#5d6e54" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-style="italic" opacity="0.7">Park</text>

  <!-- Streets -->
  <line x1="0" y1="200" x2="800" y2="200" stroke="#bcb8ad" stroke-width="1.2" stroke-dasharray="6 6"/>
  <line x1="0" y1="350" x2="800" y2="350" stroke="#bcb8ad" stroke-width="1.2" stroke-dasharray="6 6"/>
  <line x1="280" y1="0" x2="280" y2="450" stroke="#bcb8ad" stroke-width="1.2" stroke-dasharray="6 6"/>
  <line x1="560" y1="0" x2="560" y2="450" stroke="#bcb8ad" stroke-width="1.2" stroke-dasharray="6 6"/>

  <!-- City blocks -->
  <g fill="#fff" stroke="#d8d4cb" stroke-width="1">
    <rect x="20" y="20" width="240" height="160" rx="6"/>
    <rect x="300" y="20" width="240" height="160" rx="6"/>
    <rect x="20" y="220" width="240" height="110" rx="6"/>
    <rect x="300" y="220" width="240" height="110" rx="6"/>
    <rect x="580" y="240" width="200" height="90" rx="6"/>
    <rect x="20" y="370" width="520" height="60" rx="6"/>
    <rect x="580" y="350" width="200" height="80" rx="6"/>
  </g>

  <!-- Venue marker -->
  <g transform="translate(360, 175)">
    <ellipse cx="0" cy="55" rx="22" ry="6" fill="url(#pinShadow)"/>
    <path d="M0 -38 C -16 -38 -22 -22 -22 -10 C -22 4 -8 18 0 36 C 8 18 22 4 22 -10 C 22 -22 16 -38 0 -38 Z"
          fill="#c31e2e" stroke="#7d121c" stroke-width="1.5"/>
    <circle cx="0" cy="-12" r="6" fill="#fff"/>
  </g>

  <!-- Label -->
  <g transform="translate(395, 145)">
    <rect x="0" y="0" width="140" height="36" rx="6" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
    <text x="10" y="16" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" font-weight="700" fill="#1a1a1a">Das Wormser</text>
    <text x="10" y="30" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" fill="#5c5c5c">Rathenaustraße 11</text>
  </g>

  <!-- Compass -->
  <g transform="translate(740, 60)">
    <circle r="20" fill="#fff" stroke="#1a1a1a" stroke-width="1"/>
    <path d="M0 -14 L4 0 L0 14 L-4 0 Z" fill="#c31e2e"/>
    <text y="-24" text-anchor="middle" font-family="-apple-system, Segoe UI, sans-serif" font-size="10" font-weight="700" fill="#1a1a1a">N</text>
  </g>

  <!-- Legend -->
  <g transform="translate(20, 410)">
    <circle cx="6" cy="0" r="5" fill="#c31e2e"/>
    <text x="18" y="4" font-family="-apple-system, Segoe UI, sans-serif" font-size="11" fill="#1a1a1a">Spielstätte Das Wormser</text>
  </g>
</svg>