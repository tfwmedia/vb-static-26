name: Test & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      clean_slate:
        description: "Delete remote files before upload (full replace deploy)"
        required: false
        default: false
        type: boolean
      dry_run:
        description: "Run deployment without writing changes to server"
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Quality Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check (astro check)
        run: npm run check

      - name: Build
        run: npm run build

      - name: Serve dist
        run: |
          set -euo pipefail
          cd dist
          nohup python3 -m http.server 8080 > /tmp/static-server.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8080/ > /dev/null 2>&1 && echo "✓ Server ready" && exit 0
            echo "  waiting... ($i)"
            sleep 1
          done
          echo "::error::Static server did not start in time."
          cat /tmp/static-server.log || true
          exit 1

      - name: Check all routes return HTTP 200
        run: |
          set -euo pipefail
          ERROR=0
          routes=(
            "/"
            "/spielzeit/"
            "/weihnachtsmaerchen/"
            "/verein/"
            "/kontakt/"
            "/impressum/"
            "/datenschutz/"
            "/404.html"
            "/sitemap.xml"
            "/robots.txt"
          )
          for route in "${routes[@]}"; do
            status=$(curl -o /dev/null -s -w "%{http_code}" "http://127.0.0.1:8080$route")
            if [ "$status" = "200" ]; then
              echo "  ✓ $route → $status"
            else
              echo "::error::Route $route returned HTTP $status (expected 200)"
              ERROR=1
            fi
          done
          [ $ERROR -eq 0 ] || exit 1

      # Hinweis: Der 301-Redirect /tickets-kaufen/ → Ticket-Regional liegt in
      # public/.htaccess (Apache) und ist daher erst auf dem Live-Server wirksam.

      - name: Check critical assets are reachable
        run: |
          set -euo pipefail
          ERROR=0
          assets=(
            "/assets/img/vb-logo.png"
            "/assets/img/vb-icon.png"
            "/assets/img/loeffelliste.webp"
            "/assets/img/bsm.webp"
            "/assets/img/map-wormser.svg"
            "/assets/img/og-home.svg"
            "/assets/img/og-spielzeit.svg"
            "/assets/img/og-verein.svg"
            "/assets/img/og-kontakt.svg"
            "/assets/img/og-maerchen.svg"
            "/assets/fonts/InterVariable.woff2"
          )
          for asset in "${assets[@]}"; do
            status=$(curl -o /dev/null -s -w "%{http_code}" "http://127.0.0.1:8080$asset")
            if [ "$status" = "200" ]; then
              echo "  ✓ $asset → $status"
            else
              echo "::error::Asset $asset returned HTTP $status (expected 200)"
              ERROR=1
            fi
          done
          [ $ERROR -eq 0 ] || exit 1

      - name: Check content integrity (Termine + Rechtstexte)
        run: |
          set -euo pipefail
          check() {
            local file="$1" needle="$2" label="$3"
            if curl -s "http://127.0.0.1:8080$file" | grep -qF "$needle"; then
              echo "  ✓ $label"
            else
              echo "::error::Content check failed: $label (needle '$needle' not in $file)"
              exit 1
            fi
          }
          check "/spielzeit/" "2026-12-01" "Spielplan: Weihnachtsmärchen-Termine"
          check "/spielzeit/" "2026-10-03" "Spielplan: Premiere Löffelliste"
          check "/impressum/" "VR 10302" "Impressum: Vereinsregister"
          check "/datenschutz/" "Datenschutz-Grundverordnung" "Datenschutz: DSGVO-Erklärung"

      - name: Upload static server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: static-server-log
          path: /tmp/static-server.log
          retention-days: 7

  deploy:
    name: Deploy dist/ to FTP
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies & build
        run: |
          npm ci
          npm run build

      - name: Validate required secrets
        run: |
          set -euo pipefail
          [ -n "${{ secrets.FTP_SERVER }}" ] || (echo "::error::Missing secret FTP_SERVER" && exit 1)
          [ -n "${{ secrets.FTP_USERNAME }}" ] || (echo "::error::Missing secret FTP_USERNAME" && exit 1)
          [ -n "${{ secrets.FTP_PASSWORD }}" ] || (echo "::error::Missing secret FTP_PASSWORD" && exit 1)

      - name: Deploy dist/ to FTP server (attempt 1)
        id: deploy_attempt_1
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT != '' && secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL != '' && secrets.FTP_PROTOCOL || 'ftp' }}
          security: ${{ secrets.FTP_SECURITY != '' && secrets.FTP_SECURITY || 'loose' }}
          timeout: ${{ secrets.FTP_TIMEOUT != '' && secrets.FTP_TIMEOUT || 120000 }}
          local-dir: dist/
          state-name: ${{ secrets.FTP_STATE_NAME != '' && secrets.FTP_STATE_NAME || 'ftp-deploy-sync-state.json' }}
          log-level: ${{ secrets.FTP_LOG_LEVEL != '' && secrets.FTP_LOG_LEVEL || 'standard' }}
          server-dir: ${{ secrets.FTP_SERVER_DIR != '' && secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.DS_Store
            **/*.map

      - name: Deploy retry (attempt 2, same protocol)
        id: deploy_attempt_2
        if: steps.deploy_attempt_1.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT != '' && secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_PROTOCOL != '' && secrets.FTP_PROTOCOL || 'ftp' }}
          security: ${{ secrets.FTP_SECURITY != '' && secrets.FTP_SECURITY || 'loose' }}
          timeout: ${{ secrets.FTP_TIMEOUT != '' && secrets.FTP_TIMEOUT || 120000 }}
          local-dir: dist/
          state-name: ${{ secrets.FTP_STATE_NAME != '' && secrets.FTP_STATE_NAME || 'ftp-deploy-sync-state.json' }}
          log-level: verbose
          server-dir: ${{ secrets.FTP_SERVER_DIR != '' && secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.DS_Store
            **/*.map

      - name: Deploy fallback (attempt 3, alternate protocol)
        id: deploy_attempt_3
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure'
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT != '' && secrets.FTP_PORT || 21 }}
          protocol: ${{ secrets.FTP_FALLBACK_PROTOCOL != '' && secrets.FTP_FALLBACK_PROTOCOL || 'ftps-legacy' }}
          security: ${{ secrets.FTP_SECURITY != '' && secrets.FTP_SECURITY || 'loose' }}
          timeout: ${{ secrets.FTP_TIMEOUT != '' && secrets.FTP_TIMEOUT || 120000 }}
          local-dir: dist/
          state-name: ${{ secrets.FTP_STATE_NAME != '' && secrets.FTP_STATE_NAME || 'ftp-deploy-sync-state.json' }}
          log-level: verbose
          server-dir: ${{ secrets.FTP_SERVER_DIR != '' && secrets.FTP_SERVER_DIR || '/' }}
          dangerous-clean-slate: ${{ github.event_name == 'workflow_dispatch' && inputs.clean_slate }}
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          exclude: |
            **/.DS_Store
            **/*.map

      - name: Fail workflow if deploy never succeeded
        if: steps.deploy_attempt_1.outcome == 'failure' && steps.deploy_attempt_2.outcome == 'failure' && steps.deploy_attempt_3.outcome == 'failure'
        run: |
          echo "::error::FTP deploy failed after 3 attempts (primary + retry + fallback protocol)."
          echo "::error::Check FTP_PROTOCOL/FTP_PORT/FTP_SECURITY and inspect logs above."
          exit 1
